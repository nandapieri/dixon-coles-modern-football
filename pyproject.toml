[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dixon-coles-modern"
version = "0.1.0"
description = "Research on classical football score models in contemporary European football."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4", "pandas==3.1.1", "scipy==1.18.1", "openpyxl==3.1.5",
    "penaltyblog==1.13.1", "scikit-learn==1.9.1", "matplotlib==3.11.2", "seaborn==0.13.2",
    "jupyterlab==4.6.6", "ipykernel==7.4.0", "pytest==9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
